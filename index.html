<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>セキュリティ学習クエスト</title><style>body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 70px}h1{font-size:24px}button,select{font:inherit}button{cursor:pointer;border-radius:13px;border:1px solid #40536f;background:#1c2c44;color:white;padding:14px;text-align:left;width:100%;margin:5px 0}button:disabled{opacity:.7}.primary{background:#2266da;text-align:center;border:0;font-weight:bold}.terminal{background:#070d12;border:1px solid #3a5663;border-radius:12px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 ui-monospace,monospace;min-height:100px;color:#8ce3a6}.panel{background:#142238;border-radius:14px;padding:15px;margin:15px 0}.muted{color:#b3c2d6;font-size:14px}.good{border-color:#43cc8b;background:#174333}.bad{border-color:#f17d86;background:#512936}select{background:#1c2c44;color:white;border:1px solid #40536f;border-radius:8px;padding:12px;width:100%}.hidden{display:none}.pill{display:inline-block;background:#263f61;padding:5px 10px;border-radius:30px;font-size:12px}#status{margin:10px 0;color:#b3c2d6}</style></head><body><main><h1>🛡️ セキュリティ学習クエスト</h1><p class="muted">iPhone向け・画面付き4択・復習と予習・全300問</p><div id="home"><div class="panel"><label for="mode">学習モード</label><select id="mode"><option value="review">復習（これまでの学習）</option><option value="preview">予習（次に学ぶ内容）</option><option value="missed">間違えた問題だけ</option><option value="all">すべての問題</option></select><label for="count">1回の問題数</label><select id="count"><option value="5">5問</option><option value="10">10問</option><option value="20">20問</option></select><p id="stats" class="muted"></p><button class="primary" id="start">クイズをスタート</button></div><p class="muted">画面は実際のLinuxを模した教材用表示です。端末上でコマンドは実行しません。</p></div><div id="game" class="hidden"><div id="progress" class="muted"></div><div class="panel"><span id="topic" class="pill"></span><pre id="terminal" class="terminal"></pre><h2 id="question" style="font-size:19px"></h2><div id="options"></div><div id="feedback" class="hidden panel" aria-live="polite"></div><button id="next" class="primary hidden">次へ</button></div></div><div id="result" class="hidden panel"><h2>結果発表</h2><p id="score"></p><button class="primary" id="back">トップに戻る</button></div><div id="status" role="status"></div></main><script src="app.js?v=2" defer></script></body></html>
