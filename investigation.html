<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Lv.3 調査シミュレーション</title><style>body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,sans-serif}main{max-width:640px;margin:auto;padding:20px 16px 80px}h1{font-size:24px}h2{font-size:19px}.panel{background:#142238;padding:16px;border-radius:14px;margin:14px 0}button,a.btn{box-sizing:border-box;display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #45617c;border-radius:12px;background:#1c2c44;color:white;text-align:left;font:inherit;text-decoration:none}.primary{background:#2266da;text-align:center;font-weight:700}.muted{color:#b3c2d6;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070d12;border-radius:10px;padding:14px;color:#8ce3a6;line-height:1.6;font-size:13px}.hidden{display:none}.good{border-color:#43cc8b}.bad{border-color:#f17d86}button:disabled{opacity:.65}.tag{display:inline-block;background:#263f61;border-radius:20px;padding:5px 10px;font-size:13px}#feedback{line-height:1.7}</style></head><body><main><a href="./missions.html" class="btn">← 職業体験に戻る</a><h1>🔎 Lv.3 調査シミュレーション</h1><p class="muted">架空のログと企業を使う演習です。実際の通信やコマンド実行は行いません。証拠を選んでから判断します。</p><section id="home"><div id="cases"></div></section><section id="game" class="hidden"><div class="panel"><span id="progress" class="tag"></span><h2 id="title"></h2><p id="intro"></p><h2>① 調べる証拠を選ぶ</h2><p class="muted">証拠は何度でも開けます。判断に必要なものを確認してください。</p><div id="evidence"></div><pre id="log">証拠を選ぶとここに表示されます。</pre><p id="seen" class="muted"></p><h2>② 調査結果を判断する</h2><p id="question"></p><div id="choices"></div><div id="feedback" class="panel hidden" aria-live="polite"></div><button id="next" class="primary hidden">次へ</button><button id="pause">⏸ 一時中断して一覧へ</button></div></section><section id="result" class="panel hidden"><h2>調査完了</h2><p id="summary"></p><button id="back" cla
