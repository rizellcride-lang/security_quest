<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>職業体験ミッション | セキュリティ学習クエスト</title><style>body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:20px 16px 70px}h1{font-size:24px}h2{font-size:20px}.panel{background:#142238;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#b3c2d6;font-size:14px}button,a.btn{display:block;box-sizing:border-box;width:100%;background:#1c2c44;color:#fff;border:1px solid #40536f;border-radius:12px;padding:13px;margin:8px 0;text-align:left;font:inherit;text-decoration:none}.primary{background:#2266da;text-align:center;font-weight:700}button:disabled{opacity:.6}.good{border-color:#43cc8b;background:#174333}.bad{border-color:#f17d86;background:#512936}pre{background:#070d12;border:1px solid #3a5663;border-radius:10px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 monospace;color:#8ce3a6}#feedback{line-height:1.65}.hidden{display:none}.pill{font-size:13px;color:#a8d2ff}</style></head><body><main><a href="./index.html" class="btn">← 通常クイズに戻る</a><h1>🛡️ 5職種の入門ミッション</h1><p class="muted">架空の企業・ログを使う安全な演習です。外部への通信やコマンド実行はありません。各職種4場面、全20場面。</p><div class="panel"><h2>🔎 Lv.3 調査シミュレーション</h2><p class="muted">ログ・本人確認・変更履歴など、複数の証拠を集めて判断する3案件です。</p><a href="./investigation.html" class="btn primary">Lv.3の調査へ進む</a></div><section id="home"><div id="cards"></div></section><section id="game" class="hidden"><div class="panel"><div id="progress" class="pill"></div><h2 id="missionTitle"></h2><pre id="screen"></pre><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="panel hidden" aria-live="polite"></div><button id="next" class="primary hidden">次の場面へ</button><button id="pause">⏸ 一時中断して一覧へ</button></div></section><section id="result" class="panel hidden"><h2>ミッション完了</h2><p id="summary"></p><button id="back" class="primary">一覧へ戻る</button></section><p id="status" class="muted" role="status"></p></main><script>const missions=[["SOCアナリスト","不審なログインを調査",[["監視画面：同じアカウントに失敗が15回。その後成功が1回。","最初に何を確認する？",["成功したので問題なしとする","時刻・送信元IP・利用者の通常の行動を照合","直ちに全サーバーを停止","警告を削除"],1,"失敗後の成功は調査の手がかりです。ログだけで侵害とは断定できません。"],["認証ログ：09:01〜09:05 失敗15回 203.0.113.10 / 09:06 成功 203.0.113.10","次の適切な判断は？",["侵害確定","同じ送信元での成功は要確認。本人確認と追加ログ調査を行う","全件誤検知","ログを公開する"],1,"同一IPでも共有回線や正規操作の可能性があり、追加の証拠が必要です。"],["本人への確認：この時刻にログインしていない。端末記録：未知の端末。","優先する対応は？",["放置する","定められた手順でセッション無効化や認証情報保護を担当者へ依頼","ログを消す","社外へ個人情報を送る"],1,"権限と手順に従い、被害拡大を抑えながら証拠を保全します。"],["調査メモ：失敗15回→成功1回／本人否認／未知の端末","報告に必要な内容は？",["『攻撃です』の一言だけ","時系列・確認済み事実・未確認点・対応・引継ぎ先","推測だけ","ログを削除した報告"],1,"事実と推測を区別し、次の担当者が追える記録を残します。"]]],["インシデント対応担当","端末の異常を調べる",[["社員PC：突然動作が重くなり、不審な警告が出た。","最初にすべきことは？",["勝手に初期化","状況・時刻を記録し、組織の対応手順を確認","すべてのファイルを削除","SNSに投稿"],1,"初動で証拠を消さず、手順と権限を確認します。"],["端末記録：見慣れないプログラムが起動。","次の調査は？",["プログラム名・起動元・時刻を記録し照合","直ちに犯人を特定したと宣言","履歴を消す","調査を終了"],0,"不審なプログラムだけでは悪意の証明になりません。"],["社内手順：感染疑い端末の隔離は担当者承認が必要。","適切な対応は？",["許可なく全ネットワーク停止","担当者へ連絡し承認のうえ隔離を検討","端末を他人へ渡す","記録を消す"],1,"隔離は有効な場合がありますが、業務影響と証拠保全を考えます。"],["収集済み：発見時刻・プログラム名・対応履歴。","引継ぎに必要なのは？",["確認済み事実と未確認事項、対応の時系列","個人的な印象だけ","何も残さない","すべて断定する"],0,"証拠の出所と時系列を残すことが重要です。"]]],["脆弱性診断担当","Webサービスの安全性を点検",[["依頼書：自社テストサイト example.test のみ診断許可。","最初に確認することは？",["許可範囲・時間・禁止事項","他社サイトも調べる","大量アクセスする","許可は不要"],0,"診断は事前の許可と対象範囲の確認が必須です。"],["テスト画面：HTTP/1.1 200 OK","この応答から分かるのは？",["侵入成功","HTTP要求が正常に処理された","脆弱性ゼロ","管理者権限取得"],1,"HTTP 200だけで安全性や侵入の成否は判断できません。"],["テスト画面：HTTP/1.1 404 Not Found","適切な判断は？",["対象ページが見つからない。原因は追加確認","必ずサーバー停止","脆弱性確定","ログを削除"],0,"404は指定したページが見つからないことを表します。"],["調査結果：設定の確認が必要だが再現条件は未確定。","報告方法は？",["重大と断定","観察事実・再現手順・影響の不確実性・改善案を記録","何も書かない","無断で本番を変更"],1,"確かめた範囲と未確認の範囲を分けて報告します。"]]],["デジタルフォレンジック担当","ファイルの証拠を確認",[["保全対象：社員PCの不審なファイル sample.bin","最初に優先するのは？",["元データを保全し、取得元・時刻を記録","元ファイルを上書き","いきなり実行","ファイルを公開"],0,"フォレンジックは電子的な証拠を調べる仕事です。元データの保全が基本です。"],["$ file sample.bin\nsample.bin: PNG image data","読み取れることは？",["ファイルの内容からPNG形式と推定","安全と確定","感染と確定","必ず実行ファイル"],0,"fileはファイルの種類を推定します。安全性の判定ではありません。"],["$ sha256sum sample.bin\nab12... (演習用の省略表示)","この値の用途は？",["ファイルの同一性確認の手がかり","犯人の名前を表示","通信を遮断","削除を実行"],0,"SHA-256はファイル内容から計算する識別用の値です。証拠の一致確認に使います。"],["記録：保全時刻、取得元、ファイル種類、識別値","報告で重要なのは？",["誰がいつ何を扱ったかと確認結果","推測だけ","元データの変更","記録を破棄"],0,"証拠の扱いの履歴を残し、後から検証できるようにします。"]]],["セキュリティ運用担当","設定ミスを改善",[["点検：社員アカウントに不要な管理者権限が付いている疑い。","最初にすることは？",["業務上必要な権限か担当者へ確認","すべての利用者を削除","無断で停止","放置"],0,"必要最小限の権限だけを与える考え方を最小権限と呼びます。"],["権限一覧：一般社員に管理者権限。業務担当者は不要と回答。","適切な次の行動は？",["変更申請と影響確認","即時全システム停止","権限を増やす","記録を消す"],0,"権限の変更は承認と影響確認を経て行います。"],["変更手順：承認後に権限を修正。","変更後の確認は？",["業務が動き、不要な権限が消えたことを検証","確認不要","履歴を削除","別の権限を付与"],0,"変更後の動作確認までが運用作業です。"],["記録：変更前後の権限、承認者、確認結果。","完了報告に含めるのは？",["変更理由・承認・実施内容・検証結果","感想だけ","パスワードの全文","未確認なのに完了と断定"],0,"再現できる作業記録と、秘密情報を含めない報告が必要です。"]]]];const KEY='security-quest-careers-v1';let state={mission:0,step:0,score:0,answered:false,selected:null,done:{}};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('status').textContent='このブラウザでは進捗を保存できません。'}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Number.isInteger(x.mission)&&x.mission>=0&&x.mission<missions.length&&Number.isInteger(x.step)&&x.step>=0&&x.step<4){state={...state,...x,done:x.done||{}}}}catch(e){}}function show(id){['home','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function el(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function home(){show('home');const cards=$('cards');cards.replaceChildren();missions.forEach((m,i)=>{let p=el('div','','panel');p.append(el('h2',m[0]),el('p',m[1],'muted'));let b=el('button',state.mission===i&&state.step>0?'▶ 途中から再開':'▶ ミッションを始め','primary');b.onclick=()=>{if(state.mission!==i||state.step===0){state.mission=i;state.step=0;state.score=0;state.answered=false;state.selected=null}save();render()};p.append(b);if(state.done[i]!==undefined)p.append(el('p','前回の成績：'+state.done[i]+'/4','pill'));cards.append(p)})}function render(){show('game');let m=missions[state.mission],s=m[2][state.step];$('progress').textContent='場面 '+(state.step+1)+' / 4　・　正解 '+state.score+' 問';$('missionTitle').textContent=m[0]+'：'+m[1];$('screen').textContent=s[0];$('question').textContent=s[1];$('choices').replaceChildren();s[2].forEach((option,i)=>{let b=el('button',(i+1)+'. '+option,state.answered?(i===s[3]?'good':i===state.selected?'bad':''):'');b.disabled=state.answered;b.onclick=()=>{if(state.answered)return;state.selected=i;state.answered=true;if(i===s[3])state.score++;save();render()};$('choices').append(b)});$('feedback').classList.toggle('hidden',!state.answered);$('feedback').textContent=state.answered?(state.selected===s[3]?'正解。':'不正解。')+' '+s[4]:'';$('next').classList.toggle('hidden',!state.answered);$('next').textContent=state.step===3?'結果を見る':'次の場面へ'}$('next').onclick=()=>{if(!state.answered)return;if(state.step===3){state.done[state.mission]=state.score;save();$('summary').textContent=missions[state.mission][0]+'：4問中 '+state.score+' 問正解。必要なら何度でも復習できます。';state.step=0;state.score=0;state.answered=false;state.selected=null;save();show('result')}else{state.step++;state.answered=false;state.selected=null;save();render()}};$('pause').onclick=()=>{save();home()};$('back').onclick=home;load();home();</script></body></html>
