<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Lv.6 実務型調査シミュレーター</title><style>body{margin:0;background:#0b1220;color:#eef3ff;font-family:-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:18px 16px 80px}h1{font-size:24px}h2{font-size:19px}.panel{background:#142238;border-radius:14px;padding:16px;margin:14px 0}button,a.btn{box-sizing:border-box;display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #45617c;border-radius:12px;background:#1c2c44;color:#fff;text-align:left;font:inherit;text-decoration:none}.primary{background:#2266da;text-align:center;font-weight:bold}.muted{color:#b3c2d6;font-size:14px}.hidden{display:none}.good{border-color:#43cc8b;background:#174333}.bad{border-color:#f17d86;background:#512936}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070d12;color:#8ce3a6;border-radius:10px;padding:14px;font-size:13px;line-height:1.6}.pill{display:inline-block;background:#263f61;padding:5px 10px;border-radius:20px;font-size:13px}.feedback{white-space:pre-wrap;line-height:1.7}label{display:block;margin:10px 0 5px}select{box-sizing:border-box;width:100%;padding:12px;background:#1c2c44;color:white;border:1px solid #45617c;border-radius:10px;font:inherit}</style></head><body><main><a class="btn" href="./index.html">← ホームへ戻る</a><h1>🔎 Lv.6 実務型調査シミュレーター</h1><p class="muted">架空の3事件を調査します。証拠を開く順番は自由。調査・判断・対応・報告を100点で評価します。実際の外部通信や攻撃は行いません。</p><section id="home"><div id="cases"></div></section><section id="game" class="hidden"><div class="panel"><p id="progress" class="pill"></p><h2 id="title"></h2><p id="intro"></p><h2>① 証拠を調べる</h2><div id="documents"></div><pre id="document">調査資料を選んでください。</pre><p id="readStatus" class="muted" aria-live="polite"></p><div id="newAlert" class="panel hidden" aria-live="polite"><h2>🚨 調査中に追加警告</h2><p id="alertText"></p><button id="ackAlert">追加警告を確認する</button><p class="muted">新しい情報を読んでから判断してください。</p></div><h2>② 仮説を立てる</h2><p class="muted">仮説とは、今ある証拠から考えた説明です。あとで見直して構いません。</p><div id="hypotheses"></div><h2>③ 次の対応を選ぶ</h2><div id="actions"></div><h2>④ 調査報告を選ぶ</h2><div id="reports"></div><button id="submit" class="primary">調査を完了して採点</button><button id="pause">⏸ 途中保存して一覧へ</button></div></section><section id="result" class="panel hidden"><h2>調査結果</h2><p id="summary"></p><div id="breakdown"></div><p id="explanation" class="feedback"></p><button id="retry">同じ事件を再調査</button><button id="back" class="primary">事件一覧へ戻る</button></section><p id="status" class="muted" role="status"></p><section id="commandLab" data-level="6" class="panel" aria-label="コマンド実習"></section></main><script src="./simulator.js?v=2" defer></script><script src="./command-lab.js?v=1" defer></script></body></html>
